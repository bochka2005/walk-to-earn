<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walk to Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
        }
        .container { max-width: 400px; width: 100%; }
        .balance-card {
            background: linear-gradient(135deg, #1a1a3e, #16213e);
            border: 1px solid rgba(46, 154, 254, 0.2);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
        }
        .balance-value {
            font-size: 48px;
            font-weight: 700;
            color: #2e9afe;
            letter-spacing: -1px;
        }
        .status-card {
            background: #16162a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-label { font-size: 14px; color: rgba(255,255,255,0.5); }
        .status-value {
            font-size: 14px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
        }
        .status-value.idle { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }
        .status-value.walking { background: rgba(46,154,254,0.15); color: #2e9afe; }
        .status-value.limited { background: rgba(255,170,0,0.15); color: #ffaa00; }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
            margin-bottom: 24px;
        }
        .btn:active { transform: scale(0.97); }
        .btn-start { background: #2e9afe; color: #fff; }
        .btn-stop {
            background: rgba(255,255,255,0.08);
            color: #ff4757;
            border: 1px solid rgba(255,71,87,0.2);
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .stat-box {
            background: #16162a;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .stat-value { font-size: 22px; font-weight: 700; color: #e0e0e0; }
        .stat-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 4px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(22,22,42,0.95);
            border: 1px solid rgba(46,154,254,0.2);
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 14px;
            color: #e0e0e0;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }
        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 420px) {
            body { padding: 12px; }
            .balance-value { font-size: 38px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="balance-card">
            <div class="balance-label">Your Balance</div>
            <div class="balance-value" id="balanceDisplay">0</div>
        </div>

        <div class="status-card">
            <span class="status-label">Status</span>
            <span class="status-value idle" id="statusBadge">Idle</span>
        </div>

        <button class="btn btn-start" id="walkBtn">Start Walking</button>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="distDisplay">0.0</div>
                <div class="stat-label">Distance (m)</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="speedDisplay">0.0</div>
                <div class="stat-label">Speed (km/h)</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function () {
            var TG = window.Telegram?.WebApp;
            if (TG) { TG.ready(); TG.expand(); }

            var balanceEl = document.getElementById('balanceDisplay');
            var statusBadge = document.getElementById('statusBadge');
            var walkBtn = document.getElementById('walkBtn');
            var distDisplay = document.getElementById('distDisplay');
            var speedDisplay = document.getElementById('speedDisplay');
            var toastEl = document.getElementById('toast');

            var walking = false;
            var intervalId = null;
            var watchId = null;
            var currentPos = null;
            var lastPingResponse = null;

            function showToast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('visible');
                clearTimeout(toastEl._hide);
                toastEl._hide = setTimeout(function () {
                    toastEl.classList.remove('visible');
                }, 2200);
            }

            function setStatus(type, text) {
                statusBadge.className = 'status-value ' + type;
                statusBadge.textContent = text;
            }

            function updateUI(data) {
                balanceEl.textContent = data.total_coins ?? 0;
                distDisplay.textContent = (data.distance_m ?? 0).toFixed(1);
                speedDisplay.textContent = (data.speed_kmh ?? 0).toFixed(1);

                if (data.status === 'speed_limit_exceeded') {
                    setStatus('limited', 'Too fast!');
                } else if (walking) {
                    setStatus('walking', 'Walking');
                } else {
                    setStatus('idle', 'Idle');
                }
            }

            async function sendPing() {
                if (!currentPos) return;

                var initData = TG ? TG.initData : '';
                if (!initData) {
                    showToast('No Telegram init data');
                    return;
                }

                try {
                    var res = await fetch('/walk/ping', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            init_data: initData,
                            lat: currentPos.lat,
                            lon: currentPos.lon,
                        }),
                    });

                    var data = await res.json();

                    if (!res.ok) {
                        showToast(data.detail || 'Ping error');
                        return;
                    }

                    lastPingResponse = data;
                    updateUI(data);

                    if (data.coins_earned > 0) {
                        showToast('+' + data.coins_earned + ' coins');
                    }
                } catch (err) {
                    showToast('Network error');
                }
            }

            function onPosition(pos) {
                currentPos = {
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                };
            }

            function onPositionError(err) {
                var msg = 'GPS error';
                if (err.code === 1) msg = 'GPS permission denied';
                else if (err.code === 2) msg = 'GPS unavailable';
                else if (err.code === 3) msg = 'GPS timeout';
                showToast(msg);
            }

            function startWalking() {
                if (walking) return;
                walking = true;

                setStatus('walking', 'Walking');
                walkBtn.textContent = 'Stop Walking';
                walkBtn.className = 'btn btn-stop';

                if (lastPingResponse) updateUI(lastPingResponse);

                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(
                        onPosition, onPositionError,
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
                    );
                } else {
                    showToast('Geolocation not available');
                    walking = false;
                    setStatus('idle', 'Idle');
                    walkBtn.textContent = 'Start Walking';
                    walkBtn.className = 'btn btn-start';
                    return;
                }

                intervalId = setInterval(sendPing, 15000);
            }

            function stopWalking() {
                if (!walking) return;
                walking = false;

                clearInterval(intervalId);
                intervalId = null;

                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                currentPos = null;

                setStatus('idle', 'Idle');
                walkBtn.textContent = 'Start Walking';
                walkBtn.className = 'btn btn-start';
            }

            async function fetchUser() {
                var initData = TG ? TG.initData : '';
                if (!initData) return;
                try {
                    var res = await fetch('/user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ init_data: initData }),
                    });
                    var data = await res.json();
                    if (res.ok) {
                        balanceEl.textContent = data.balance;
                        distDisplay.textContent = data.total_distance_m.toFixed(1);
                    }
                } catch (_) {}
            }
            fetchUser();

            walkBtn.addEventListener('click', function () {
                if (walking) stopWalking();
                else startWalking();
            });

            var clickCount = 0;
            var clickTimer = null;
            document.querySelector('.balance-card').addEventListener('click', function () {
                clickCount++;
                clearTimeout(clickTimer);
                clickTimer = setTimeout(function () { clickCount = 0; }, 1200);
                if (clickCount >= 5) {
                    clickCount = 0;
                    var command = prompt('Admin console:');
                    if (command && command.trim()) {
                        var initData = TG ? TG.initData : '';
                        fetch('/admin/console', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ init_data: initData, command: command.trim() }),
                        })
                        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
                        .then(function (ref) {
                            if (ref.ok) {
                                showToast(ref.data.message || 'OK');
                                if (ref.data.new_balance !== undefined) {
                                    balanceEl.textContent = ref.data.new_balance;
                                }
                            } else {
                                showToast(ref.data.detail || 'Admin error');
                            }
                        })
                        .catch(function () { showToast('Admin request failed'); });
                    }
                }
            });
        })();
    </script>
</body>
</html>
